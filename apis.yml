aid: 1uphealth
url: https://raw.githubusercontent.com/api-evangelist/1uphealth/refs/heads/main/apis.yml
name: 1upHealth
kind: company
description: >-
  1upHealth is a US healthcare data interoperability company, founded in 2017 and
  headquartered in Boston, Massachusetts, that operates an HL7 FHIR-first health data
  platform for claims and clinical data acquisition, exchange, and compute. Built on a
  lakehouse architecture, the platform lets health plans, providers, and digital health
  developers ingest, normalize, store, and query patient and member data as FHIR, and
  ships modular solutions aligned to US federal interoperability mandates - Patient
  Access, Provider Access, Payer-to-Payer Data Exchange, Provider Directory, Formulary,
  and Electronic Prior Authorization (CMS Interoperability & Prior Authorization,
  CMS-0057-F). 1upHealth runs a managed, HIPAA-compliant FHIR REST API cloud server
  exposing FHIR R4 (4.0.1), STU3 (3.0.2), and DSTU2 (1.0.2) endpoints, each publishing a
  live CapabilityStatement, secured with SMART-on-FHIR OAuth 2.0. The company is
  HITRUST, SOC 2, and HIPAA aligned. Home market is the United States. Developer
  documentation is public at docs.1up.health, while provisioning API credentials and the
  developer console require an account (gated self-serve / partner onboarding).
