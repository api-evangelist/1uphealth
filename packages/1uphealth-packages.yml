notes: >-
  1upHealth does not publish REST/OAuth SDKs in the conventional sense (no
  language client wrapping the FHIR API); its one actively-maintained first-party
  package is fhir-react, a UI component library for rendering FHIR resources
  (also indexed separately under components/1uphealth-components.yml). The
  matching source repo (github.com/1uphealth/fhir-react) is no longer publicly
  visible on GitHub (404 as of 2026-08-14) even though the npm package continues
  to ship current releases — the org's public repo list (github.com/1uphealth)
  currently shows only forks/tooling repos, not fhir-react itself. Several other
  1uphealth-related npm packages were found and are recorded as non-official:
  a 2019 unscoped provider-search widget whose hosting repo is gone, two
  @1uphealth-temp/* packages last published in 2019 (7+ years stale — an
  abandonment signal, not a supported package), and two community forks of
  fhir-react maintained by third-party individuals, not 1upHealth staff.
